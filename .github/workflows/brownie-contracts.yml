name: Independent Brownie smart-contract tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  brownie-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated Brownie toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install eth-brownie==1.21.0
          npm install --global ganache-cli@6.12.2
          brownie --version
          ganache-cli --version
      - name: Run Solidity contract tests (Brownie)
        working-directory: smart_contracts
        run: |
          brownie test -s --network development tests/
