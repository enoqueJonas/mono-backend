name: Backend QA (unit and integration-style tests)

on:
  pull_request:
  push:
    branches: [master]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python code
        run: python -m compileall -q accounts blockchain contributions core credentials disbursements groups identity penalties wallets config
      - name: Collect tests
        run: python -m pytest --collect-only -q
      - name: Run Django suite
        run: python -m pytest -q
