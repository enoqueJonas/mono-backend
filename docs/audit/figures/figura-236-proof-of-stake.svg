<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="465" viewBox="0 0 1920 465" role="img"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="#2876A2"/></marker></defs><rect width="1920" height="465" fill="#FFFFFF"/><text x="960" y="57" text-anchor="middle" fill="#15394E" font-size="50" font-weight="700" font-family="DejaVu Sans, sans-serif">PROOF OF STAKE (PoS) — MODELO CONCEPTUAL</text><rect x="35" y="127" width="445" height="212" rx="22" fill="#EAF6F3" stroke="#087F88" stroke-width="3"/><rect x="38" y="130" width="439" height="13" rx="5" fill="#087F88"/><text x="257.5" y="196" text-anchor="middle" fill="#087F88" font-size="42" font-weight="700" font-family="DejaVu Sans, sans-serif">1. PARTICIPAR</text><text x="257.5" y="252" text-anchor="middle" fill="#15394E" font-size="36" font-weight="400" font-family="DejaVu Sans, sans-serif">Garantia (stake)</text><text x="257.5" y="300" text-anchor="middle" fill="#15394E" font-size="36" font-weight="400" font-family="DejaVu Sans, sans-serif">e elegibilidade</text><path d="M482 321 L511 321" fill="none" stroke="#2876A2" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="511" y="127" width="445" height="212" rx="22" fill="#EFF5F9" stroke="#2876A2" stroke-width="3"/><rect x="514" y="130" width="439" height="13" rx="5" fill="#2876A2"/><text x="733.5" y="196" text-anchor="middle" fill="#2876A2" font-size="42" font-weight="700" font-family="DejaVu Sans, sans-serif">2. SELECCIONAR</text><text x="733.5" y="252" text-anchor="middle" fill="#15394E" font-size="36" font-weight="400" font-family="DejaVu Sans, sans-serif">Proponente conforme</text><text x="733.5" y="300" text-anchor="middle" fill="#15394E" font-size="36" font-weight="400" font-family="DejaVu Sans, sans-serif">regras do protocolo</text><path d="M958 321 L987 321" fill="none" stroke="#2876A2" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="987" y="127" width="445" height="212" rx="22" fill="#EAF6F3" stroke="#087F88" stroke-width="3"/><rect x="990" y="130" width="439" height="13" rx="5" fill="#087F88"/><text x="1209.5" y="196" text-anchor="middle" fill="#087F88" font-size="42" font-weight="700" font-family="DejaVu Sans, sans-serif">3. PROPOR</text><text x="1209.5" y="252" text-anchor="middle" fill="#15394E" font-size="36" font-weight="400" font-family="DejaVu Sans, sans-serif">Bloco e verificação</text><text x="1209.5" y="300" text-anchor="middle" fill="#15394E" font-size="36" font-weight="400" font-family="DejaVu Sans, sans-serif">pelos validadores</text><path d="M1434 321 L1463 321" fill="none" stroke="#2876A2" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1463" y="127" width="445" height="212" rx="22" fill="#EFF5F9" stroke="#2876A2" stroke-width="3"/><rect x="1466" y="130" width="439" height="13" rx="5" fill="#2876A2"/><text x="1685.5" y="196" text-anchor="middle" fill="#2876A2" font-size="42" font-weight="700" font-family="DejaVu Sans, sans-serif">4. DECIDIR</text><text x="1685.5" y="252" text-anchor="middle" fill="#15394E" font-size="36" font-weight="400" font-family="DejaVu Sans, sans-serif">Votos, escolha de</text><text x="1685.5" y="300" text-anchor="middle" fill="#15394E" font-size="36" font-weight="400" font-family="DejaVu Sans, sans-serif">cadeia e finalidade</text><text x="960" y="412" text-anchor="middle" fill="#47677A" font-size="37" font-weight="400" font-family="DejaVu Sans, sans-serif">Selecção, recompensas, penalizações e slashing variam conforme o protocolo.</text></svg>