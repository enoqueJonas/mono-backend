<text x="900" y="72" class="hd" text-anchor="middle" >EXEMPLO DE LIGAÇÃO ENTRE BLOCOS</text><text x="900" y="121" class="sm" text-anchor="middle" >O campo de referência associa cada bloco ao resumo criptográfico do seu antecessor</text><rect x="65" y="230" width="480" height="488" rx="24" fill="#EFF7FA" stroke="#195D86" stroke-width="4"/><rect x="65" y="230" width="480" height="86" rx="20" fill="#195D86" stroke="#195D86" stroke-width="4"/><text x="305" y="284" style="fill:#FFFFFF" font-family="DejaVu Sans" font-size="36" font-weight="700" text-anchor="middle">Bloco n−1</text><text x="90" y="347" class="md" text-anchor="start" >Cabeçalho</text><text x="90" y="381" class="xs" text-anchor="start" >metadados do bloco</text><text x="90" y="444" class="md" text-anchor="start" >Hash anterior</text><text x="90" y="478" class="xs" text-anchor="start" >referência ao antecessor</text><text x="90" y="541" class="md" text-anchor="start" >Compromisso de dados</text><text x="90" y="575" class="xs" text-anchor="start" >ex.: raiz de Merkle</text><text x="90" y="638" class="md" text-anchor="start" >Dados de consenso</text><text x="90" y="672" class="xs" text-anchor="start" >conforme o protocolo</text><path d="M560 435 H629" stroke="#195D86" stroke-width="6" fill="none" marker-end="url(#arrow)"/><rect x="655" y="230" width="480" height="488" rx="24" fill="#E8F4F2" stroke="#195D86" stroke-width="4"/><rect x="655" y="230" width="480" height="86" rx="20" fill="#195D86" stroke="#195D86" stroke-width="4"/><text x="895" y="284" style="fill:#FFFFFF" font-family="DejaVu Sans" font-size="36" font-weight="700" text-anchor="middle">Bloco n</text><text x="680" y="347" class="md" text-anchor="start" >Cabeçalho</text><text x="680" y="381" class="xs" text-anchor="start" >metadados do bloco</text><text x="680" y="444" class="md" text-anchor="start" >Hash anterior</text><text x="680" y="478" class="xs" text-anchor="start" >referência ao antecessor</text><text x="680" y="541" class="md" text-anchor="start" >Compromisso de dados</text><text x="680" y="575" class="xs" text-anchor="start" >ex.: raiz de Merkle</text><text x="680" y="638" class="md" text-anchor="start" >Dados de consenso</text><text x="680" y="672" class="xs" text-anchor="start" >conforme o protocolo</text><path d="M1150 435 H1219" stroke="#195D86" stroke-width="6" fill="none" marker-end="url(#arrow)"/><rect x="1245" y="230" width="480" height="488" rx="24" fill="#EFF7FA" stroke="#195D86" stroke-width="4"/><rect x="1245" y="230" width="480" height="86" rx="20" fill="#195D86" stroke="#195D86" stroke-width="4"/><text x="1485" y="284" style="fill:#FFFFFF" font-family="DejaVu Sans" font-size="36" font-weight="700" text-anchor="middle">Bloco n+1</text><text x="1270" y="347" class="md" text-anchor="start" >Cabeçalho</text><text x="1270" y="381" class="xs" text-anchor="start" >metadados do bloco</text><text x="1270" y="444" class="md" text-anchor="start" >Hash anterior</text><text x="1270" y="478" class="xs" text-anchor="start" >referência ao antecessor</text><text x="1270" y="541" class="md" text-anchor="start" >Compromisso de dados</text><text x="1270" y="575" class="xs" text-anchor="start" >ex.: raiz de Merkle</text><text x="1270" y="638" class="md" text-anchor="start" >Dados de consenso</text><text x="1270" y="672" class="xs" text-anchor="start" >conforme o protocolo</text><text x="900" y="801" class="xs" text-anchor="middle" >Campos apresentados de forma ilustrativa; a estrutura efectiva depende da blockchain.</text>
