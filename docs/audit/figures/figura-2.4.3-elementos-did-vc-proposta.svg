<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="736" viewBox="0 0 1600 736" role="img" aria-labelledby="figtitle figdesc"><title id="figtitle">Elementos possíveis de uma solução DID/VC</title><desc id="figdesc">Quatro elementos possíveis: DIDs, credenciais verificáveis, aplicação/carteira de titular e registo opcional. Não são camadas obrigatórias. O protótipo não implementa SSI completa.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#236489"/></marker></defs><rect width="1600" height="736" fill="#FFFFFF"/><text x="800" y="55" fill="#172D42" font-size="35" font-weight="700" text-anchor="middle"><tspan x="800" dy="0">Elementos possíveis de uma solução DID/VC</tspan></text><text x="800" y="96" fill="#526677" font-size="21" font-weight="400" text-anchor="middle"><tspan x="800" dy="0">Os elementos não constituem três camadas obrigatórias, nem implicam que o protótipo implemente todos.</tspan></text><rect x="66" y="150" width="706" height="226" rx="18" fill="#EFF5FB" stroke="#386B8C" stroke-width="3"/><text x="419" y="198" fill="#172D42" font-size="23" font-weight="700" text-anchor="middle"><tspan x="419" dy="0">IDENTIFICADORES DESCENTRALIZADOS (DID)</tspan></text><text x="419" y="254" fill="#172D42" font-size="21" font-weight="400" text-anchor="middle"><tspan x="419" dy="0">Podem identificar participantes e apontar para</tspan><tspan x="419" dy="36">material de verificação. A resolução depende</tspan><tspan x="419" dy="36">do método DID e não exige sempre blockchain.</tspan></text><rect x="828" y="150" width="706" height="226" rx="18" fill="#F0F8F4" stroke="#397964" stroke-width="3"/><text x="1181" y="198" fill="#172D42" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1181" dy="0">CREDENCIAIS VERIFICÁVEIS (VC)</tspan></text><text x="1181" y="254" fill="#172D42" font-size="21" font-weight="400" text-anchor="middle"><tspan x="1181" dy="0">Declarações emitidas sobre um sujeito, protegidas</tspan><tspan x="1181" dy="36">por mecanismo de integridade e autenticidade.</tspan><tspan x="1181" dy="36">Assinatura não significa cifragem dos dados.</tspan></text><rect x="66" y="426" width="706" height="226" rx="18" fill="#F6F4FB" stroke="#766390" stroke-width="3"/><text x="419" y="474" fill="#172D42" font-size="23" font-weight="700" text-anchor="middle"><tspan x="419" dy="0">APLICAÇÃO OU CARTEIRA DO TITULAR</tspan></text><text x="419" y="530" fill="#172D42" font-size="21" font-weight="400" text-anchor="middle"><tspan x="419" dy="0">Pode permitir receber, gerir e apresentar credenciais.</tspan><tspan x="419" dy="36">O protótipo não disponibiliza uma carteira SSI</tspan><tspan x="419" dy="36">completa nem interoperabilidade pública de DID.</tspan></text><rect x="828" y="426" width="706" height="226" rx="18" fill="#F7F8FA" stroke="#7C8794" stroke-width="3"/><text x="1181" y="474" fill="#172D42" font-size="23" font-weight="700" text-anchor="middle"><tspan x="1181" dy="0">REGISTO DE CONFIANÇA — OPCIONAL</tspan></text><text x="1181" y="530" fill="#172D42" font-size="21" font-weight="400" text-anchor="middle"><tspan x="1181" dy="0">Pode apoiar resolução, ancoragem ou estado.</tspan><tspan x="1181" dy="36">No protótipo, a blockchain mantém hash e revogação;</tspan><tspan x="1181" dy="36">as chaves do emissor são obtidas na aplicação.</tspan></text><text x="800" y="696" fill="#425566" font-size="19" font-weight="400" text-anchor="middle"><tspan x="800" dy="0">Representação conceptual de possibilidades de implementação; não equivale à arquitectura completa do sistema desenvolvido.</tspan></text></svg>