0" y="257" text-anchor="middle" fill="#15394E" font-size="37" font-weight="400" font-family="DejaVu Sans, sans-serif">Validar prova</text><path d="M1151 310 L1181 310" fill="none" stroke="#2876A2" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1184" y="132" width="348" height="205" rx="22" fill="#EFF5F9" stroke="#2876A2" stroke-width="3"/><rect x="1187" y="135" width="342" height="13" rx="5" fill="#2876A2"/><text x="1358.0" y="201" text-anchor="middle" fill="#2876A2" font-size="40" font-weight="700" font-family="DejaVu Sans, sans-serif">4. DIFUNDIR</text><text x="1358.0" y="257" text-anchor="middle" fill="#15394E" font-size="37" font-weight="400" font-family="DejaVu Sans, sans-serif">Partilhar bloco</text><path d="M1534 310 L1564 310" fill="none" stroke="#2876A2" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="1567" y="132" width="348" height="205" rx="22" fill="#EFF5F9" stroke="#2876A2" stroke-width="3"/><rect x="1570" y="135" width="342" height="13" rx="5" fill="#2876A2"/><text x="1741.0" y="201" text-anchor="middle" fill="#2876A2" font-size="40" font-weight="700" font-family="DejaVu Sans, sans-serif">5. ANEXAR</text><text x="1741.0" y="257" text-anchor="middle" fill="#15394E" font-size="37" font-weight="400" font-family="DejaVu Sans, sans-serif">Estender cadeia</text><text x="960" y="422" text-anchor="middle" fill="#15394E" font-size="40" font-weight="400" font-family="DejaVu Sans, sans-serif">A confirmação tende a ganhar confiança com mais trabalho acumulado.</text><text x="960" y="477" text-anchor="middle" fill="#47677A" font-size="37" font-weight="400" font-family="DejaVu Sans, sans-serif">Podem ocorrer blocos concorrentes e reorganizações da cadeia.</text></svg>