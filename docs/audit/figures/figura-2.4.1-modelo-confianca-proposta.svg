<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="figtitle figdesc"><title id="figtitle">Modelo conceptual de confiança entre emissor, titular e verificador</title><desc id="figdesc">Emissor emite credencial com prova de integridade; titular recebe e apresenta; verificador valida e opcionalmente consulta registo de confiança. A blockchain é opcional conforme arquitectura.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#236489"/></marker></defs><rect width="1600" height="660" fill="#FFFFFF"/><text x="800" y="56" fill="#172D42" font-size="34" font-weight="700" text-anchor="middle"><tspan x="800" dy="0">Modelo conceptual de confiança entre emissor, titular e verificador</tspan></text><text x="800" y="94" fill="#526677" font-size="20" font-weight="400" text-anchor="middle"><tspan x="800" dy="0">Papéis distintos; a verificação criptográfica não ocorre necessariamente na blockchain</tspan></text><rect x="60" y="156" width="400" height="228" rx="20" fill="#ECF5FB" stroke="#386B8C" stroke-width="3"/><text x="260" y="202" fill="#172D42" font-size="28" font-weight="700" text-anchor="middle"><tspan x="260" dy="0">EMISSOR</tspan></text><text x="260" y="264" fill="#172D42" font-size="22" font-weight="400" text-anchor="middle"><tspan x="260" dy="0">Emite uma credencial</tspan><tspan x="260" dy="35">e protege a sua integridade</tspan><tspan x="260" dy="35">por assinatura digital.</tspan></text><rect x="600" y="156" width="400" height="228" rx="20" fill="#F0F8F4" stroke="#397964" stroke-width="3"/><text x="800" y="202" fill="#172D42" font-size="28" font-weight="700" text-anchor="middle"><tspan x="800" dy="0">TITULAR</tspan></text><text x="800" y="264" fill="#172D42" font-size="22" font-weight="400" text-anchor="middle"><tspan x="800" dy="0">Recebe e pode apresentar</tspan><tspan x="800" dy="35">a credencial, conforme</tspan><tspan x="800" dy="35">o modelo adoptado.</tspan></text><rect x="1140" y="156" width="400" height="228" rx="20" fill="#F2F4FA" stroke="#386B8C" stroke-width="3"/><text x="1340" y="202" fill="#172D42" font-size="28" font-weight="700" text-anchor="middle"><tspan x="1340" dy="0">VERIFICADOR</tspan></text><text x="1340" y="264" fill="#172D42" font-size="22" font-weight="400" text-anchor="middle"><tspan x="1340" dy="0">Confere assinatura, emissor,</tspan><tspan x="1340" dy="35">validade e estado</tspan><tspan x="1340" dy="35">da credencial.</tspan></text><path d="M466 288 H591" stroke="#236489" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M1006 288 H1131" stroke="#236489" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="528" y="250" fill="#172D42" font-size="21" font-weight="700" text-anchor="middle"><tspan x="528" dy="0">Emissão</tspan></text><text x="1068" y="250" fill="#172D42" font-size="21" font-weight="700" text-anchor="middle"><tspan x="1068" dy="0">Apresentação</tspan></text><rect x="86" y="460" width="1428" height="117" rx="14" fill="#FAFBFD" stroke="#A0ADBA" stroke-width="3"/><text x="800" y="495" fill="#172D42" font-size="24" font-weight="700" text-anchor="middle"><tspan x="800" dy="0">REGISTO DE CONFIANÇA — QUANDO APLICÁVEL</tspan></text><text x="800" y="538" fill="#172D42" font-size="21" font-weight="400" text-anchor="middle"><tspan x="800" dy="0">No protótipo: a aplicação resolve o emissor; o contrato blockchain regista hash e estado da credencial.</tspan></text><path d="M1340 390 V450" stroke="#667D90" stroke-dasharray="8 8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="800" y="624" fill="#425566" font-size="19" font-weight="400" text-anchor="middle"><tspan x="800" dy="0">Esquema conceptual. Não representa uma carteira de identidade autossoberana integralmente implementada.</tspan></text></svg>